<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculators | Engineering Tools Hub</title>
<link rel="stylesheet" href="style.css">
<style>
.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}
.tab-btn{padding:12px 20px;border:none;background:#e2e8f0;border-radius:8px;cursor:pointer;font-weight:600}
.tab-btn.active{background:#0f172a;color:#fff}
.calc-card{display:none;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.calc-card.active{display:block}
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:1rem}
.calc-btn{background:#0f172a;color:#fff;border:none;padding:13px 24px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.result{margin-top:18px;padding:14px;background:#e0f2fe;border-radius:8px;font-size:1.15rem;font-weight:600;text-align:center;display:none}
</style>
</head>
<body>
<nav>
<div class="container">
<a href="index.html" class="logo">EngTools Hub</a>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="calculators.html" class="active">Calculators</a></li>
<li><a href="about.html">About</a></li>
</ul>
</div>
</nav>

<section>
<div class="container">
<h2 class="section-title">Engineering Calculators</h2>

<div class="tabs">
<button class="tab-btn active" onclick="showCalc('torque', this)">Torque</button>
<button class="tab-btn" onclick="showCalc('gear', this)">Gear Ratio</button>
<button class="tab-btn" onclick="showCalc('units', this)">Unit Converter</button>
<button class="tab-btn" onclick="showCalc('power', this)">Motor Power</button>
</div>

<!-- Torque -->
<div id="torque" class="calc-card active">
<h3 style="margin-bottom:18px;color:#0f172a">Torque Calculator</h3>
<div class="form-group">
<label>Force (N)</label>
<input type="number" id="force" placeholder="Enter force">
</div>
<div class="form-group">
<label>Distance (m)</label>
<input type="number" id="distance" placeholder="Enter distance">
</div>
<button class="calc-btn" onclick="calcTorque()">Calculate</button>
<div class="result" id="torqueResult"></div>
</div>

<!-- Gear -->
<div id="gear" class="calc-card">
<h3 style="margin-bottom:18px;color:#0f172a">Gear Ratio Calculator</h3>
<div class="form-group">
<label>Teeth on Driven Gear</label>
<input type="number" id="driven" placeholder="Driven gear teeth">
</div>
<div class="form-group">
<label>Teeth on Driving Gear</label>
<input type="number" id="driving" placeholder="Driving gear teeth">
</div>
<button class="calc-btn" onclick="calcGear()">Calculate</button>
<div class="result" id="gearResult"></div>
</div>

<!-- Units -->
<div id="units" class="calc-card">
<h3 style="margin-bottom:18px;color:#0f172a">Unit Converter</h3>
<div class="form-group">
<label>Value</label>
<input type="number" id="unitValue" placeholder="Enter value">
</div>
<div class="form-group">
<label>From</label>
<select id="fromUnit">
<option value="mm">mm</option>
<option value="cm">cm</option>
<option value="m">m</option>
<option value="inch">inch</option>
<option value="n">Newton (N)</option>
<option value="kgf">kgf</option>
</select>
</div>
<div class="form-group">
<label>To</label>
<select id="toUnit">
<option value="mm">mm</option>
<option value="cm">cm</option>
<option value="m">m</option>
<option value="inch">inch</option>
<option value="n">Newton (N)</option>
<option value="kgf">kgf</option>
</select>
</div>
<button class="calc-btn" onclick="convertUnit()">Convert</button>
<div class="result" id="unitResult"></div>
</div>

<!-- Power -->
<div id="power" class="calc-card">
<h3 style="margin-bottom:18px;color:#0f172a">Basic Motor Power Estimator</h3>
<div class="form-group">
<label>Torque (N·m)</label>
<input type="number" id="motorTorque" placeholder="Enter torque">
</div>
<div class="form-group">
<label>Speed (RPM)</label>
<input type="number" id="motorRpm" placeholder="Enter RPM">
</div>
<button class="calc-btn" onclick="calcPower()">Calculate Power</button>
<div class="result" id="powerResult"></div>
</div>

</div>
</section>

<footer>
<div class="container">
<p>Engineering Tools Hub • Free practical tools</p>
</div>
</footer>

<script>
function showCalc(id, btn) {
  document.querySelectorAll('.calc-card').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function calcTorque() {
  var f = parseFloat(document.getElementById('force').value);
  var d = parseFloat(document.getElementById('distance').value);
  var r = document.getElementById('torqueResult');
  if (isNaN(f) || isNaN(d)) { r.style.display='block'; r.innerHTML='Enter valid numbers'; return; }
  r.style.display='block';
  r.innerHTML = 'Torque = <strong>' + (f*d).toFixed(2) + ' N·m</strong>';
}

function calcGear() {
  var a = parseFloat(document.getElementById('driven').value);
  var b = parseFloat(document.getElementById('driving').value);
  var r = document.getElementById('gearResult');
  if (isNaN(a) || isNaN(b) || b===0) { r.style.display='block'; r.innerHTML='Enter valid numbers'; return; }
  r.style.display='block';
  r.innerHTML = 'Gear Ratio = <strong>' + (a/b).toFixed(3) + ' : 1</strong>';
}

function convertUnit() {
  var value = parseFloat(document.getElementById('unitValue').value);
  var from = document.getElementById('fromUnit').value;
  var to = document.getElementById('toUnit').value;
  var r = document.getElementById('unitResult');
  if (isNaN(value)) { r.style.display='block'; r.innerHTML='Enter a valid number'; return; }

  var base = {mm:0.001, cm:0.01, m:1, inch:0.0254, n:1, kgf:9.80665};
  var length = ['mm','cm','m','inch'];
  var force = ['n','kgf'];
  var result;

  if (length.indexOf(from) > -1 && length.indexOf(to) > -1) {
    result = value * base[from] / base[to];
  } else if (force.indexOf(from) > -1 && force.indexOf(to) > -1) {
    result = value * base[from] / base[to];
  } else {
    r.style.display='block'; r.innerHTML='Cannot convert between length and force'; return;
  }
  r.style.display='block';
  r.innerHTML = 'Result = <strong>' + result.toFixed(4) + ' ' + to + '</strong>';
}

function calcPower() {
  var t = parseFloat(document.getElementById('motorTorque').value);
  var rpm = parseFloat(document.getElementById('motorRpm').value);
  var r = document.getElementById('powerResult');
  if (isNaN(t) || isNaN(rpm)) { r.style.display='block'; r.innerHTML='Enter valid numbers'; return; }
  var power = (t * rpm) / 9549;
  r.style.display='block';
  r.innerHTML = 'Power ≈ <strong>' + power.toFixed(3) + ' kW</strong>';
}
</script>
</body>
</html>
